services:
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: always
    environment:
      WEBSOCKET_ENABLED: "true"       # Pour notifications en temps réel
      ADMIN_TOKEN: "${ADMIN_TOKEN}"   # Optionnel, pour interface admin
    volumes:
      - ${ROOT_VOLUME}/vaultwarden_data:/data
    networks:
      - proxy                       # même réseau que Nginx Proxy Manager

networks:
  proxy:
    external: true

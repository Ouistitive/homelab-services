services:
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: always
    environment:
      WEBSOCKET_ENABLED: "true"
      ADMIN_TOKEN: "${ADMIN_TOKEN}"
    volumes:
      - ${ROOT_VOLUME}/vaultwarden_data:/data
    networks:
      - proxy

networks:
  proxy:
    external: true
